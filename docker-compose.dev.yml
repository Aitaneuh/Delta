# Local development.
#   npm run dev:docker   Everything in Docker: database, API and website on http://localhost:5173
#   npm run dev:db       Only the database, to run the API and website with Node on your computer
x-node: &node
  image: delta-analyzer-dev
  working_dir: /app
  volumes:
    - .:/app
    # Keeps the Linux packages from the image instead of the ones installed on your computer
    - /app/node_modules
  environment: &node-env
    # File change events don't cross from Windows and macOS into containers, so watch by polling
    CHOKIDAR_USEPOLLING: 'true'

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: delta
      POSTGRES_USER: delta
      POSTGRES_PASSWORD: delta
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - delta_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U delta -d delta']
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    <<: *node
    # Builds the image both Node services share
    build:
      context: .
      dockerfile: Dockerfile.dev
    profiles: [app]
    command: [npx, nodemon, --legacy-watch, --watch, server, --watch, src/services, --ext, 'ts,sql', --exec, node server/index.ts]
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *node-env
      DATABASE_URL: postgres://delta:delta@db:5432/delta
      PUBLIC_URL: http://localhost:5173
      TRUST_PROXY_HOPS: 1
    ports:
      - '127.0.0.1:3000:3000'

  web:
    <<: *node
    profiles: [app]
    command: npx vite --host 0.0.0.0
    depends_on:
      - server
    # The image comes from the server service's build
    pull_policy: never
    environment:
      <<: *node-env
      API_PROXY_TARGET: http://server:3000
    ports:
      - '127.0.0.1:5173:5173'

volumes:
  delta_dev_pgdata:
